[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "virtual-world"
version = "0.1.0"
description = "Python 虚拟 3D 世界生成器：物理自洽的地形-气候-生态生成管线"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "xarray>=2024.1",
    "mlx>=0.20",
    "numba>=0.59",
    "joblib>=1.3",
    "zarr>=2.17",
    "netcdf4>=1.6",
    "matplotlib>=3.8",
    "cartopy>=0.23",
    "pyvista>=0.44",
    "vtk>=9.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
science = [
    "puffins>=0.1",
    "KoppenClimate>=0.1",
    "PyAEZ>=1.0",
    "climlab>=0.8",
]
ml = [
    "torch>=2.2",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jupyterlab>=4.1",
    "py-spy>=0.3",
    "scalene>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_world"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
